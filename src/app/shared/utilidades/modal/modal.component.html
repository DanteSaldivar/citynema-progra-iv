<div class="modal-overlay">
  <section
    class="modal-content"
    [class]="clase()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="titulo()">

    <button
      class="modal-close"
      type="button"
      aria-label="Cerrar modal"
      (click)="cerrar.emit()">
      ✕
    </button>

    <ng-content></ng-content>
  </section>
</div>
