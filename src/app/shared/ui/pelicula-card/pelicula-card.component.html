<div class="movie-card">
    <img class="movie-image" [src]="pelicula().poster_url || 'assets/placeholder.jpg'"
        [alt]="'Póster de ' + pelicula().titulo" />
    <div class="movie-details">
        <h3 class="movie-title">{{ pelicula().titulo }}</h3>

        <div class="movie-info-row">
            <span class="movie-rating">
                ⭐ {{ resenas().total > 0 ? resenas().promedio : 'S/C' }}
            </span>

            <span class="movie-age-rating" [class.adult]="esSoloAdultos()">
                {{ etiquetaClasificacion() }}
            </span>
        </div>

        <button type="button" class="btn btn-primary buy-tickets-btn" (click)="comprarEntradas()">
            Comprar Entradas
        </button>
    </div>
</div>
